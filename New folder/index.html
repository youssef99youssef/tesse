<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sir TV - بث مباشر ونتائج المباريات</title>
    <style>
        :root {
            --bg: #0f172a;
            --bg-2: #1e293b;
            --fg: #f8fafc;
            --fg-dim: #94a3b8;
            --accent: #7c3aed;
            --accent-2: #9333ea;
            --border: #334155;
            --radius: 12px;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--fg);
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        header h1 {
            margin: 0;
            font-size: 24px;
            color: var(--accent);
        }
        /* Live indicator */
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            color: var(--fg-dim);
        }
        .live-indicator .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--fg-dim);
        }
        .live-indicator.on { color: #3aff9e; border-color: rgba(58,255,158,.25); }
        .live-indicator.on .live-dot { background: #3aff9e; box-shadow: 0 0 6px #3aff9e; }
        
        /* Tabs */
        .tabs { display: flex; gap: 10px; justify-content: center; margin: 22px 0 26px; flex-wrap: wrap; }
        .tab { padding: 11px 24px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 999px; color: var(--fg-dim); font-weight: 700; font-size: 14px; cursor: pointer; }
        .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        /* Matches Container */
        .matches { display: flex; flex-direction: column; gap: 14px; max-width: 800px; margin: 0 auto; }
        .match-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; justify-content: space-between; align-items: center; }
        .team { font-weight: bold; font-size: 16px; }
        .score { font-size: 18px; font-weight: 800; background: rgba(124,58,237,.2); padding: 5px 12px; border-radius: 8px; }
        .empty { text-align: center; color: var(--fg-dim); padding: 50px 20px; background: var(--bg-2); border: 1px dashed var(--border); border-radius: var(--radius); }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header>
        <h1>Sir TV</h1>
        <div class="live-indicator on" id="liveIndicator">
            <span class="live-dot"></span>
            <span class="live-text">مباشر</span>
        </div>
    </header>

    <!-- التبويبات -->
    <div class="tabs">
        <button class="tab active">مباريات اليوم</button>
    </div>

    <!-- قائمة المباريات -->
    <div class="matches" id="matchesContainer">
        <div class="empty">جاري جلب المباريات عبر الـ API...</div>
    </div>

    <script>
        // ضع مفتاحك هنا
        const API_KEY = 'gapi_36777a3162a26eb22ca2a81c0135a198e48e465488ef7c7a949dafcb68de7145';

        async function loadMatches() {
            const container = document.getElementById('matchesContainer');
            try {
                // محاكاة الاتصال أو استبدل الرابط برابط الـ API الفعلي الخاص بـ Goal-API
                /* 
                const response = await fetch('https://api.goal-api.com/v1/matches/today', {
                    headers: { 'Authorization': `Bearer ${API_KEY}` }
                });
                const data = await response.json();
                */

                // بيانات تجريبية للتأكد من شكل العرض (يمكنك استبدالها بالبيانات الحقيقية لاحقاً)
                setTimeout(() => {
                    container.innerHTML = `
                        <div class="match-card">
                            <span class="team">ريال مدريد</span>
                            <span class="score">2 - 1</span>
                            <span class="team">برشلونة</span>
                        </div>
                        <div class="match-card">
                            <span class="team">ليفربول</span>
                            <span class="score">0 - 0</span>
                            <span class="team">مانشستر سيتي</span>
                        </div>
                    `;
                }, 1000);

            } catch (error) {
                console.error("خطأ:", error);
                container.innerHTML = `<div class="empty">فشل تحميل المباريات، تأكد من صحة المفتاح.</div>`;
            }
        }

        // تشغيل الدالة عند فتح الصفحة
        loadMatches();
    </script>
</body>
</html>
